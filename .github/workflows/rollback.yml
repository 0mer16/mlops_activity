name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Known-good version to roll back to (e.g. 1.0.0)"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  rollback-production:
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Roll back production
        run: |
          echo "Rolling back production to $IMAGE"

          docker pull "$IMAGE"

          docker stop mlops-api || true
          docker rm mlops-api || true

          docker run -d \
            --name mlops-api \
            --restart unless-stopped \
            -p 5000:5000 \
            "$IMAGE"

      - name: Verify rollback
        run: |
          sleep 5

          curl --fail --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:5000/health
