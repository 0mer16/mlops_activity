name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "Building version ${{ steps.version.outputs.version }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          GIT_COMMIT=$(git rev-parse --short HEAD)
          echo "Git commit: $GIT_COMMIT"

          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg GIT_COMMIT=$GIT_COMMIT \
            -t ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} \
            -t ghcr.io/${{ github.repository }}:latest \
            .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository }}:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        run: |
          docker pull \
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

          docker stop mlops-api || true
          docker rm mlops-api || true

          docker run -d \
            --name mlops-api \
            --restart unless-stopped \
            -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Verify staging deployment
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          sleep 5

          RESPONSE=$(curl --fail --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:5000/health)
          echo "$RESPONSE"

          # make sure staging is really running the version we just built
          echo "$RESPONSE" | python3 -c "import sys, json, os; d = json.load(sys.stdin); assert d['status'] == 'healthy'; assert d['application_version'] == os.environ['EXPECTED_VERSION'], d"

  deploy-production:
    needs:
      - build
      - deploy-staging

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy production
        run: |
          docker pull \
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

          docker stop mlops-api || true
          docker rm mlops-api || true

          docker run -d \
            --name mlops-api \
            --restart unless-stopped \
            -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Verify production deployment
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          sleep 5

          RESPONSE=$(curl --fail --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:5000/health)
          echo "$RESPONSE"

          echo "$RESPONSE" | python3 -c "import sys, json, os; d = json.load(sys.stdin); assert d['status'] == 'healthy'; assert d['application_version'] == os.environ['EXPECTED_VERSION'], d"
